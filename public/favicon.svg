<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    aMule Nuxt mark: three peers of a swarm joined by links, with the download
    arrow that the whole app is about landing in the middle. Nuxt green on the
    dark slate the dashboard uses, so the tab icon reads as the app itself.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ef0a8"/>
      <stop offset="1" stop-color="#00c46f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- links between peers -->
  <g stroke="#00dc82" stroke-opacity="0.45" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M128 148 L256 236"/>
    <path d="M384 148 L256 236"/>
    <path d="M128 148 L384 148"/>
  </g>
  <!-- peers -->
  <g fill="#00dc82">
    <circle cx="128" cy="148" r="38"/>
    <circle cx="384" cy="148" r="38"/>
  </g>
  <!-- the download arrow -->
  <path d="M256 210 v150 M186 296 l70 72 l70 -72" stroke="url(#green)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- landing line -->
  <path d="M150 420 h212" stroke="#e5e7eb" stroke-opacity="0.9" stroke-width="30" stroke-linecap="round"/>
</svg>
