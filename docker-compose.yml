version: '3.8'

services:
  amule-nuxt:
    build: .
    container_name: amule-nuxt
    ports:
      - "3000:3000"     # Nuxt web interface
      - "4712:4712"     # aMule External Connection
      - "4662:4662"     # aMule eD2k TCP
      - "4665:4665/udp" # aMule eD2k UDP
      - "4672:4672/udp" # aMule Kad UDP
    environment:
      - NODE_ENV=production
      - AMULE_EC_PASSWORD=${AMULE_EC_PASSWORD:-amule}
      - AMULE_EC_HOST=localhost
      - AMULE_EC_PORT=4712
      - NUXT_PORT=3000
    volumes:
      - amule-config:/home/amule/.aMule
      - amule-downloads:/downloads/incoming
      - amule-temp:/downloads/temp
    restart: unless-stopped
    networks:
      - amule-network

volumes:
  amule-config:
    driver: local
  amule-downloads:
    driver: local
  amule-temp:
    driver: local

networks:
  amule-network:
    driver: bridge
