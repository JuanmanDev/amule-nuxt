name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Releases must never overlap: two runs would race for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Version, changelog and zip bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag, the GitHub release and the changelog commit
      issues: write
      pull-requests: write
    outputs:
      # Empty when the commits since the last tag warrant no release
      version: ${{ steps.semantic.outputs.version }}
      tag: ${{ steps.semantic.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads every tag and commit to work out the next version
          fetch-depth: 0
          # It authenticates with GITHUB_TOKEN itself; leftover git credentials
          # only get in the way.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gate the release on the same checks CI runs, so a red build cannot be
      # tagged, published and attached to a GitHub release.
      - name: Typecheck
        run: npx nuxt typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Configure git for the changelog commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bumps package.json, writes CHANGELOG.md, builds the app, zips the
      # standalone bundle, tags, and creates the GitHub release with the zip
      # attached. See .releaserc.json.
      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Upload the zip bundle as a workflow artifact
        if: steps.semantic.outputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: amule-nuxt-${{ steps.semantic.outputs.version }}-zip
          path: dist/*.zip
          retention-days: 14

      - name: Summarise
        run: |
          if [ -n "${{ steps.semantic.outputs.version }}" ]; then
            echo "### Released ${{ steps.semantic.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release: no user facing commits since the last tag" >> "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    name: Publish the release image
    runs-on: ubuntu-latest
    needs: release
    # Tags pushed with GITHUB_TOKEN do not start another workflow run, so the
    # image has to be built here rather than by a tag triggered workflow.
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Build the exact commit the release points at, not the branch head
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the image tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          repo=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          major=${VERSION%%.*}
          minor=${VERSION%.*}
          {
            echo "list<<EOF"
            echo "$repo:$VERSION"
            echo "$repo:$minor"
            echo "$repo:$major"
            echo "$repo:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Summarise
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.list }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
