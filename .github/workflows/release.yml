name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Releases must never overlap: two runs would race for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Version, changelog and zip bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag, the GitHub release and the changelog commit
      issues: write
      pull-requests: write
    outputs:
      # Empty when the commits since the last tag warrant no release
      version: ${{ steps.semantic.outputs.version }}
      tag: ${{ steps.semantic.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads every tag and commit to work out the next version
          fetch-depth: 0
          # It authenticates with GITHUB_TOKEN itself; leftover git credentials
          # only get in the way.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Gate the release on the same checks CI runs, so a red build cannot be
      # tagged, published and attached to a GitHub release.
      - name: Typecheck
        run: npx nuxt typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Configure git for the changelog commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Bumps package.json, writes CHANGELOG.md, builds the app, zips the
      # standalone bundle, tags, and creates the GitHub release with the zip
      # attached. See .releaserc.json.
      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Upload the zip bundle as a workflow artifact
        if: steps.semantic.outputs.version != ''
        uses: actions/upload-artifact@v7
        with:
          name: amule-nuxt-${{ steps.semantic.outputs.version }}-zip
          path: dist/*.zip
          retention-days: 14

      - name: Summarise
        run: |
          if [ -n "${{ steps.semantic.outputs.version }}" ]; then
            echo "### Released ${{ steps.semantic.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release: no user facing commits since the last tag" >> "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    name: Publish the release images
    runs-on: ubuntu-latest
    needs: release
    # Tags pushed with GITHUB_TOKEN do not start another workflow run, so the
    # image has to be built here rather than by a tag triggered workflow.
    if: needs.release.outputs.version != ''
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # Build the exact commit the release points at, not the branch head
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two images per release, from the same Dockerfile:
      #
      #   X.Y.Z / X.Y / X / latest              the daemon and this app together
      #   X.Y.Z-web / X.Y-web / X-web / web     this app only, for an existing daemon
      #
      # Bake variables are read straight from the environment, so the lists are
      # derived here in one place.
      - name: Derive the image tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          repo=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          major=${VERSION%%.*}
          minor=${VERSION%.*}

          full="$repo:$VERSION,$repo:$minor,$repo:$major,$repo:latest"
          web="$repo:$VERSION-web,$repo:$minor-web,$repo:$major-web,$repo:web"

          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

      # One bake run rather than two builds: `web` is a prefix stage of `full`, so
      # the Nuxt output and the shared layers are built once and both images use
      # them. See docker-bake.hcl.
      - name: Build and push both images
        uses: docker/bake-action@v6
        env:
          APP_VERSION: ${{ needs.release.outputs.version }}
          REVISION: ${{ github.sha }}
          TAGS_FULL: ${{ steps.tags.outputs.full }}
          TAGS_WEB: ${{ steps.tags.outputs.web }}
          PLATFORMS: linux/amd64,linux/arm64
        with:
          files: docker-bake.hcl
          push: true
          provenance: true

      - name: Summarise
        run: |
          {
            echo "### Published images"
            echo
            echo "Daemon and app together:"
            echo '```'
            echo "${{ steps.tags.outputs.full }}" | tr ',' '\n'
            echo '```'
            echo "App only, for a daemon you already run:"
            echo '```'
            echo "${{ steps.tags.outputs.web }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
