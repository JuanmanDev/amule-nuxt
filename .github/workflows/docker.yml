name: Docker image

# Release images are built by release.yml, which knows the version
# semantic-release just produced. This workflow covers the two remaining cases:
#
#   * workflow_dispatch  -> an `edge` image from any branch, for testing
#   * a hand pushed v*   -> a semver tagged image, for re-publishing a release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Lets the build attach provenance to the published image
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Version for this build
        id: version
        # On a tag the version is the tag without its v; a manual build is not a
        # release, so it is labelled with the commit it came from.
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-edge.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The app-only image carries the same tags with a -web suffix, except that
      # `latest` becomes plain `web`: "latest-web" reads like a variant of latest
      # rather than the newest app-only image.
      - name: Derive the app-only tags
        id: web
        env:
          FULL_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          web=$(echo "$FULL_TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              *:latest) echo "${tag%:latest}:web" ;;
              *) echo "$tag-web" ;;
            esac
          done | paste -sd, -)
          echo "tags=$web" >> "$GITHUB_OUTPUT"

      # One bake run builds both images and shares every layer they have in
      # common; see docker-bake.hcl.
      - name: Build and push both images
        uses: docker/bake-action@v7
        env:
          APP_VERSION: ${{ steps.version.outputs.value }}
          REVISION: ${{ github.sha }}
          TAGS_FULL: ${{ join(fromJSON(steps.meta.outputs.json).tags, ',') }}
          TAGS_WEB: ${{ steps.web.outputs.tags }}
          PLATFORMS: linux/amd64,linux/arm64
        with:
          files: docker-bake.hcl
          push: true
          provenance: true

      - name: Summarise
        run: |
          {
            echo "### Published images"
            echo
            echo "Daemon and app together:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "App only, for a daemon you already run:"
            echo '```'
            echo "${{ steps.web.outputs.tags }}" | tr ',' '\n'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
